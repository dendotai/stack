name: deploy

on:
  push:
    branches: [main, dev]
    # Docs-only pushes don't change the shipped worker (docs/, *.md, and these root files aren't bundled into the build), so skip the no-op deploy. The test and build workflows still run on these. Note: a push touching ONLY these paths is skipped entirely — fine because deploy isn't a required status check.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".editorconfig"

concurrency:
  group: deploy-${{ github.ref }}
  # On dev, cancel an in-progress deploy when a newer commit is pushed. Both deploy steps are safe to interrupt: `wrangler deploy` is atomic, and `convex deploy` pushes the full desired schema+functions state — a canceled push is superseded by the newer commit redeploying that complete state. Data migrations (backfills) are run manually out-of-band, not in this workflow, so cancellation never interrupts one mid-flight. On main, runs queue instead: semantic-release pushes the tag before it writes the GitHub release, and a cancel between the two leaves a tag with no release notes.
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  deploy:
    # The env suffix shows which environment a commit deployed to, so the dev deploy check listed on a dev→main PR does not read as a prod deploy.
    name: deploy (${{ github.ref_name == 'main' && 'prod' || 'dev' }})
    runs-on: ubuntu-24.04
    environment: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      # Wrangler honors CLOUDFLARE_ENV as the default `--env` for every subcommand (deploy, secret bulk, …). With `legacy_env: true` (set in our build output) the worker name becomes `<top-level-name>-<env>`, i.e. `stack-dev` / `stack-prod` — so deploy and secret bulk both target the same worker without needing `--name` overrides. The expression repeats `environment:` above because Actions exposes no context holding the resolved environment name.
      CLOUDFLARE_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    # Job permissions cannot depend on the branch, so the dev run holds them too and uses neither.
    permissions:
      contents: write # semantic-release pushes the tag and writes the GitHub release
      pull-requests: write # `Rename the merged release PR` edits the PR title
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit since the last release

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.23.3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # Runs before the deploy steps because the web build receives the release version. A deploy that fails after this step leaves the tag ahead of prod; a re-run releases nothing new and deploys the same tag. The exact version is bumped by Renovate, and the `semantic-release-dry-run` job in test.yml dry-runs each bump on its PR. RELEASING.md has the flow.
      - name: Release
        if: github.ref_name == 'main'
        run: bunx semantic-release@25.0.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The newest tag is the release version: the one semantic-release just made, or the last one when this push released nothing (only chore: or docs: commits).
      - name: Read the release version
        id: version
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            version=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo unreleased)
          else
            version=dev
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Push backend (schema + functions) before building the worker: the build embeds VITE_CONVEX_URL, and the running worker expects the deployment it points at to already serve the current functions. The deploy key encodes which deployment to target (dev vs prod), supplied per GitHub environment. Key scopes: `deployment:deploy` plus `deployment:data:view` — installing a component (convex.config.ts installs Better Auth) reads deployment data, so `deployment:deploy` alone fails the push. A migrations step chained here (`convex run migrations:runAll`) would also need `deployment:functions:runInternalMutations`. Details and the migration gotcha: docs/SETUP.md, "Deploy-key scopes".
      - name: Deploy Convex
        working-directory: packages/api
        run: bun run deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - name: Build apps/web
        working-directory: apps/web
        run: bun run build
        env:
          VITE_CONVEX_URL: ${{ vars.CONVEX_URL }}
          VITE_WEB_VERSION: ${{ steps.version.outputs.version }}
          VITE_WEB_COMMIT: ${{ steps.version.outputs.commit }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
          # The worker holds no auth secrets: Better Auth runs on the Convex deployment and reads its own variables there (ADR 0004).
          secrets: |
            CONVEX_URL
        env:
          CONVEX_URL: ${{ vars.CONVEX_URL }}

      # A release PR opens as "Release TBD", because the version does not exist until the Release step computes it. This step writes the real title ("Release v1.4.2") onto the PR whose merge started the run. Cosmetic: prod already runs the release, so a failure here must not fail the run.
      - name: Rename the merged release PR
        if: github.ref_name == 'main'
        continue-on-error: true
        run: |
          tag=$(git tag --points-at "$GITHUB_SHA" | grep '^v' | head -1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on $GITHUB_SHA: nothing was released"
            exit 0
          fi
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number' || true)
          if [ -z "$pr" ] || [ "$pr" = null ]; then
            echo "no PR behind $GITHUB_SHA (a direct push)"
            exit 0
          fi
          gh pr edit "$pr" --title "Release $tag"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
