name: build

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verifies Vite + Wrangler config compile cleanly. Auth needs no build-time value at all — it lives on the Convex deployment (ADR 0004) — so the only input is a placeholder Convex URL.
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
