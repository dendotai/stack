name: CI

on:
  pull_request:
    paths:
      - "template/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main, dev]
    paths:
      - "template/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Checks the template as a downstream project's CI would
# (template/.github/workflows/ci.yml), from inside template/. The one step
# left out is `init.mjs --check`: the template holds every placeholder by
# definition, so that step fails here and belongs downstream only.
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Build verifies Vite + Wrangler config compile cleanly. Auth needs no
      # build-time value at all — it lives on the Convex deployment (ADR 0004) —
      # so the only input is a placeholder Convex URL.
      - name: Build
        run: bun run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
