name: test

on:
  pull_request:
  push:
    branches: [main, dev]
    paths:
      - "template/**"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Checks the template as a downstream project's test workflow would (template/.github/workflows/test.yml).
jobs:
  # The merge ruleset requires this workflow's checks on every PR, so it runs on every PR and this job decides whether the checks do real work. A job skipped by its `if:` reports success, which is what lets a PR that touches only the root merge. If the file list cannot be read, it fails open and runs everything.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      template: ${{ steps.filter.outputs.template }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          template=true
          if [ "$EVENT" = pull_request ]; then
            if files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename'); then
              grep -qE '^(template/|\.github/workflows/test\.yml$)' <<<"$files" || template=false
            else
              echo "::warning::Could not list the PR's changed files; running every check."
            fi
          fi
          echo "template=$template" >> "$GITHUB_OUTPUT"
          echo "template=$template"

  lint:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run lint

  typecheck:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  unit:
    needs: changes
    if: needs.changes.outputs.template == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run test
