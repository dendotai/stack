name: test

on:
  pull_request:
    paths:
      - "template/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main, dev]
    paths:
      - "template/**"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Checks the template as a downstream project's test workflow would (template/.github/workflows/test.yml). The one job left out is `placeholders` (`init.mjs --check`): the template holds every placeholder by definition, so that check fails here and belongs downstream only.
jobs:
  lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # setup-bun installs the latest Bun when `packageManager` names no version, so CI would run a Bun no one chose.
      - name: packageManager pins Bun
        run: jq -e '.packageManager | test("^bun@[0-9]+\\.[0-9]+\\.[0-9]+$")' package.json

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run lint

  typecheck:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  unit:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run test

  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - name: Cache convex-local-backend for e2e
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: template/packages/api/e2e/.cache
          key: convex-local-backend-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('template/packages/api/e2e/CONVEX_LOCAL_BACKEND_VERSION') }}

      - run: bun run e2e

  patches:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun scripts/check-patches.mjs
