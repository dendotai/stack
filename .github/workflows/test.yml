name: test

on:
  pull_request:
    paths:
      - "template/**"
      - ".github/workflows/test.yml"
  push:
    branches: [main, dev]
    paths:
      - "template/**"
      - ".github/workflows/test.yml"

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

# Checks the template as a downstream project's test workflow would
# (template/.github/workflows/test.yml). The one job
# left out is `placeholders` (`init.mjs --check`): the template holds every
# placeholder by definition, so that check fails here and belongs downstream
# only.
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run test
