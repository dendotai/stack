name: build

on:
  pull_request:
    paths:
      - "template/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main, dev]
    paths:
      - "template/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Builds the template as a downstream project's build workflow would
# (template/.github/workflows/build.yml).
jobs:
  # Verifies Vite + Wrangler config compile cleanly. Auth needs no
  # build-time value at all — it lives on the Convex deployment (ADR 0004) —
  # so the only input is a placeholder Convex URL.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: template
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          VITE_CONVEX_URL: https://example.convex.cloud
